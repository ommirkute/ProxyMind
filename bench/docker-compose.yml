# Deliberately vulnerable apps used to benchmark ProxyMind and the agents
# that drive it. Run only on an isolated machine or network.
#
#   docker compose -f bench/docker-compose.yml up -d
#
# Juice Shop: http://127.0.0.1:3000
# crAPI:      see bench/README.md (uses its own compose file)

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  vampi:
    image: erev0s/vampi@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
    environment:
      vulnerable: "1"
      tokentimetolive: "3600"
    ports:
      - "127.0.0.1:5002:5000"
    restart: unless-stopped
