# Known vulnerabilities in VulnShop (proxymind demo-target).
# Used by `proxymind bench score` to measure what a run found and proved.
app: VulnShop
vulns:
  - id: VS-1
    class: idor
    method: GET
    path: /api/orders/{id}
    description: Any logged-in user can read any order (no ownership check).
  - id: VS-2
    class: bfla
    method: GET
    path: /api/admin/users
    description: Admin user list only checks login, not role.
  - id: VS-3
    class: sqli
    method: GET
    path: /api/products/search
    description: Blind SQL injection in q (boolean and time based, errors hidden).
  - id: VS-4
    class: ssrf
    method: GET
    path: /api/fetch
    description: url parameter fetched server-side without an allow-list.
  - id: VS-5
    class: race_condition
    method: POST
    path: /api/giftcard/redeem
    description: One-per-user gift card checked then credited without a lock; concurrent requests all succeed.
  - id: VS-6
    class: xss
    method: GET
    path: /search
    description: q is written into the HTML results page without encoding (reflected XSS).
  - id: VS-7
    class: sqli
    method: GET
    path: /api/reviews
    description: A quote in product returns the database error (error-based SQL injection).
  - id: VS-8
    class: open_redirect
    method: GET
    path: /go
    description: Redirects to any url, including other sites.
  - id: VS-9
    class: path_traversal
    method: GET
    path: /download
    description: ../ in file reaches /etc/passwd.
  - id: VS-10
    class: ssti
    method: GET
    path: /greet
    description: '{{7*191}} in name is evaluated to 1337.'
  - id: VS-11
    class: weak_token
    method: POST
    path: /api/password/reset
    description: Reset codes are a counter (each is the previous plus one).
  - id: VS-12
    class: idor
    method: POST
    path: /graphql
    description: The GraphQL invoice(id) resolver returns any user's invoice (REST checks ownership).
  - id: VS-13
    class: exposure
    method: GET
    path: /.git/config
    description: The .git folder is served; its config has a deploy token in the remote URL.
# Correctly protected look-alikes. A finding here is a false positive.
  - id: VS-14
    class: command_injection
    method: GET
    path: /api/tools/ping
    description: host parameter goes into a shell command line (simulated shell).
  - id: VS-15
    class: sqli
    method: GET
    path: /api/products
    description: Time-based blind SQL injection in the User-Agent header.
  - id: VS-16
    class: xxe
    method: POST
    path: /api/import
    description: XML import resolves external entities over http (blind XXE).
  - id: VS-17
    class: auth_bypass
    method: GET
    path: /api/internal/config
    description: 403 unless X-Forwarded-For is 127.0.0.1, which any client can send.
  - id: VS-18
    class: crlf
    method: GET
    path: /api/lang
    description: set parameter goes into Set-Cookie as is (header injection).
  - id: VS-19
    class: host_header_injection
    method: GET
    path: /api/share
    description: share links built from the Host header.
  - id: VS-20
    class: cors
    method: GET
    path: /api/me
    description: any Origin echoed with credentials allowed.
  - id: VS-21
    class: nosqli
    method: POST
    path: /api/v2/login
    description: MongoDB-style login runs operators such as $ne in the JSON.
  - id: VS-22
    class: exposure
    method: GET
    path: /api/products
    description: hidden debug parameter leaks internal settings.
  - id: VS-23
    class: stored_xss
    method: POST
    path: /api/guestbook
    description: guestbook messages are shown on /guestbook without encoding.
  - id: VS-24
    class: csrf
    method: POST
    path: /api/profile
    description: email change needs only the session cookie (no token, no Origin check).
  - id: VS-25
    class: dom_xss
    method: GET
    path: /welcome
    description: welcome.js writes the name parameter into the page with innerHTML.
  - id: VS-26
    class: sqli
    method: GET
    path: /api/recommend
    description: ctx is base64 JSON; its category goes into SQL unescaped.
  - id: VS-27
    class: jwt
    method: GET
    path: /api/v3/profile
    description: login JWTs use the secret "secret", and alg none is accepted.
  - id: VS-28
    class: graphql
    method: POST
    path: /graphql
    description: introspection on, batched operations run.
  - id: VS-29
    class: cache_poisoning
    method: GET
    path: /api/banner
    description: X-Forwarded-Host goes into the cached page.
  - id: VS-30
    class: cache_deception
    method: GET
    path: /api/account/settings
    description: suffixes ignored, .css responses cached with private data.
  - id: VS-31
    class: mass_assignment
    method: POST
    path: /api/register
    description: role comes from the request.
  - id: VS-32
    class: prototype_pollution
    method: POST
    path: /api/preferences
    description: deep merge does not skip __proto__.
  - id: VS-33
    class: csrf
    method: POST
    path: /graphql
    description: GraphQL takes cross-site requests with the session cookie (no token, any content type).
secure:
  - GET /api/invoices/{id}
  - GET /api/admin/stats
  - GET /api/orders
  - GET /help
  - GET /out
  - GET /docs
  - POST /api/settings
  - GET /hello
  - GET /api/notice
  - GET /api/account/keys
  - POST /api/signup
