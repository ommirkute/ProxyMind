name: Nightly

# Slow checks that don't need to run on every push: fuzzing the parsers
# that read hostile input, and building the container image.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - http_messages
          - websocket_frames
          - dns_query
          - payload_classifier
          - crawl_extract
          - intruder_template
          - passive_checks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=2048
        working-directory: fuzz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: proxymind:nightly
      - name: Smoke test
        run: |
          docker run --rm proxymind:nightly --version
          docker run --rm proxymind:nightly proof browser | grep -q /usr/bin/chromium
