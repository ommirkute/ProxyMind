name: Nightly

# Slow checks that don't need to run on every push: fuzzing the parsers
# that read hostile input, and building the container image.
# Manual only for now, to stay within the plan's Actions minutes (a full
# run is about 90 minutes). To run it on a schedule again, add:
#   schedule:
#     - cron: "17 3 * * 0"   # weekly, Sunday 03:17 UTC
on:
  workflow_dispatch:
    inputs:
      only_bench:
        description: "Run only the benchmarks (skips fuzzing and the image build, about 15 minutes instead of 90)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    if: ${{ !inputs.only_bench }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - http_messages
          - websocket_frames
          - dns_query
          - payload_classifier
          - crawl_extract
          - fuzzer_template
          - passive_checks
          - openapi_spec
          - har_curl
          - graphql_schema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=2048
        working-directory: fuzz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts

  image:
    if: ${{ !inputs.only_bench }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: proxymind:nightly
      - name: Smoke test
        run: |
          docker run --rm proxymind:nightly --version
          docker run --rm proxymind:nightly proof browser | grep -q /usr/bin/chromium

  bench:
    name: benchmarks (model-free baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release -p pm-cli
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the GHCR image mirror when it has been filled
        run: |
          mirror="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bench-mirror"
          if docker manifest inspect "$mirror/bkimminich/juice-shop:v20.3.0" >/dev/null 2>&1; then
            echo "BENCH_REGISTRY=$mirror" >> "$GITHUB_ENV"
          else
            echo "No mirror yet (run the Bench images workflow); pulling from Docker Hub."
          fi
      - name: Start Juice Shop and VAmPI
        run: docker compose -f bench/docker-compose.yml up -d juice-shop vampi
      - name: Run benchmarks
        env:
          PROXYMIND: ${{ github.workspace }}/target/release/proxymind
          OUT: ${{ runner.temp }}/bench
        run: |
          for app in vulnshop vampi juice-shop; do
            WORK=$(mktemp -d) bench/run.sh "$app"
          done
          cat "$OUT"/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench
    permissions:
      contents: read
      packages: read
