name: CI

# Sized to stay within a private repository's Actions minutes (macOS bills
# 10x and Windows 2x):
# - Pull requests run once per push, on Linux only. Their branches don't
#   also run on push, which used to start a second run for every commit.
# - Pushes to main and manual runs (Actions → CI → Run workflow, on any
#   branch) cover all three OSes; run one on a PR's branch before merging.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  ui:
    name: web UI (typecheck, build, browser end-to-end)
    # Pinned: Playwright can't install Chromium's system packages on newer images yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build -p pm-cli
      - name: Python SDK tests (against the real binary)
        run: python3 -m unittest discover -s sdk/python/tests -v
        env:
          PROXYMIND: ${{ github.workspace }}/target/debug/proxymind
      - name: TypeScript SDK (typecheck, build, tests against the real binary)
        run: npm ci && npm run build && npm test
        working-directory: sdk/typescript
        env:
          PROXYMIND: ${{ github.workspace }}/target/debug/proxymind
      - run: npx playwright-core install --with-deps chromium
        working-directory: ui
      - run: npm run test:e2e
        working-directory: ui
        env:
          SCREENSHOTS: ${{ runner.temp }}/ui-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots

  desktop:
    name: desktop app (Tauri, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
      - run: cargo fmt --check
        working-directory: desktop
      # Not --locked: the app's path dependencies change with the workspace.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      # The desktop app has its own lockfile (and desktop/deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: desktop/Cargo.toml
          command: check advisories
