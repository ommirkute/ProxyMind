[package]
name = "pm-plugin"
description = "Plugin manifests, the user's plugin registry and the passive-check protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
schemars = "1.2.3"
pm-core = { version = "0.2.0", path = "../pm-core" }
pm-http = { version = "0.2.0", path = "../pm-http" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "1.1.0"
thiserror = "2.0.21"
ring = "0.17.14"
parking_lot = "0.12.5"
tokio = { version = "1.53.3", features = ["sync", "time", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }

[lints]
workspace = true
