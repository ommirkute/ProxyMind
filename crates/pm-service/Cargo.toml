[package]
name = "pm-service"
description = "The single service layer every client goes through."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.38"
parking_lot = "0.12.5"
pm-ai = { version = "0.0.1", path = "../pm-ai" }
pm-core = { version = "0.0.1", path = "../pm-core" }
pm-diff = { version = "0.0.1", path = "../pm-diff" }
pm-http = { version = "0.0.1", path = "../pm-http" }
pm-identity = { version = "0.0.1", path = "../pm-identity" }
pm-ledger = { version = "0.0.1", path = "../pm-ledger" }
pm-model = { version = "0.0.1", path = "../pm-model" }
pm-oast = { version = "0.0.1", path = "../pm-oast" }
pm-policy = { version = "0.0.1", path = "../pm-policy" }
pm-proof = { version = "0.0.1", path = "../pm-proof" }
pm-replay = { version = "0.0.1", path = "../pm-replay" }
pm-store = { version = "0.0.1", path = "../pm-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
pm-demo = { path = "../pm-demo" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
