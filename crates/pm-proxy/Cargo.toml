[package]
name = "pm-proxy"
description = "Intercepting proxy: listener, CONNECT, TLS interception."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"

pm-http = { version = "0.0.1", path = "../pm-http" }
pm-tls = { path = "../pm-tls" }
pm-store = { path = "../pm-store" }
pm-replay = { version = "0.0.1", path = "../pm-replay" }
pm-core = { version = "0.0.1", path = "../pm-core" }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
regex = "1.13.1"
flate2 = "1.1.10"

[lints]
workspace = true

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
