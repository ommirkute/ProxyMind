[package]
name = "pm-demo"
description = "VulnShop: a small, deliberately vulnerable API for demos and tests. Never expose it to a network."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pm-http = { version = "0.1.0", path = "../pm-http" }
# A real in-memory database for the SQL injection demos.
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde_json = "1.0.154"
ring = "0.17.14"
sha1_smol = "1.0.1"
tokio = { version = "1.53.3", features = ["full"] }

[lints]
workspace = true
