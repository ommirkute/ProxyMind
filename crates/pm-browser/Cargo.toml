[package]
name = "pm-browser"
description = "Headless Chromium over the DevTools protocol, for rendering recorded responses offline."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pm-core = { version = "0.1.0", path = "../pm-core" }
pm-http = { version = "0.1.0", path = "../pm-http" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"

