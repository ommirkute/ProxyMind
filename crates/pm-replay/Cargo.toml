[package]
name = "pm-replay"
description = "Send engine for replays and parallel sends."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
pm-core = { version = "0.1.0", path = "../pm-core" }
pm-http = { version = "0.1.0", path = "../pm-http" }
pm-tls = { version = "0.1.0", path = "../pm-tls" }
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
h2 = "0.4.20"
http = "1.5.0"
bytes = "1.12.1"

[lints]
workspace = true

[dev-dependencies]
pm-tls = { path = "../pm-tls" }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
