[package]
name = "pm-api"
description = "REST API and event stream."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http2"] }
futures-util = "0.3.34"
pm-accounts = { version = "0.2.0", path = "../pm-accounts" }
pm-assistant = { version = "0.2.0", path = "../pm-assistant" }
pm-core = { version = "0.2.0", path = "../pm-core" }
pm-service = { version = "0.2.0", path = "../pm-service" }
pm-tls = { version = "0.2.0", path = "../pm-tls" }
ring = "0.17.14"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
url = "2.5.9"

[lints]
workspace = true

[dev-dependencies]
pm-demo = { path = "../pm-demo" }
