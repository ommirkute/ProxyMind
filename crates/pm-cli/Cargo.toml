[package]
name = "pm-cli"
description = "The `proxymind` command-line tool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "proxymind"
path = "src/main.rs"

[dependencies]
pm-proxy = { path = "../pm-proxy" }
pm-tls = { path = "../pm-tls" }
pm-store = { path = "../pm-store" }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.53.3", features = ["full"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.154"
pm-service = { version = "0.0.1", path = "../pm-service" }
jiff = "0.2.38"
pm-mcp = { version = "0.0.1", path = "../pm-mcp" }
pm-demo = { version = "0.0.1", path = "../pm-demo" }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
