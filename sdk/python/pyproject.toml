[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxymind"
version = "0.2.0"
description = "Python client for the ProxyMind REST API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
classifiers = ["Topic :: Security", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/ommirkute/proxymind"

[tool.setuptools]
packages = ["proxymind"]
