[workspace]
resolver = "3"
members = ["crates/*"]
# Built on their own: the desktop app needs WebKitGTK, fuzzing needs nightly.
exclude = ["desktop", "fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ommirkute/proxymind"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# SQLite (with its full-text index) and zstd are C code that does the heavy lifting of every store call;
# unoptimized they make debug builds and the test suite several times slower than they need to be.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
