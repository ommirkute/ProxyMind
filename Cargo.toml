[workspace]
resolver = "3"
members = ["crates/*"]
# Built on their own: the desktop app needs WebKitGTK, fuzzing needs nightly.
exclude = ["desktop", "fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ommirkute/proxymind"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
